<script>
"use strict";
// ---- csTimer mathlib.js より必要な関数のみ抜粋 ----
var mathlib = (function() {
	var fact = [1];
	for (var i = 0; i < 32; i++) {
		fact[i + 1] = fact[i] * (i + 1);
	}
	function circle(arr) {
		var length = arguments.length - 1,
			temp = arr[arguments[length]];
		for (var i = length; i > 1; i--) {
			arr[arguments[i]] = arr[arguments[i - 1]];
		}
		arr[arguments[1]] = temp;
		return circle;
	}

	function setNPerm(arr, idx, n, even) {
		var prt = 0;
		if (even < 0) {
			idx <<= 1;
		}
		if (n >= 16) {
			arr[n - 1] = 0;
			for (var i = n - 2; i >= 0; i--) {
				arr[i] = idx % (n - i);
				prt ^= arr[i];
				idx = ~~(idx / (n - i));
				for (var j = i + 1; j < n; j--) {
					arr[j] >= arr[i] && arr[j]++;
				}
			}
			if (even < 0 && (prt & 1) != 0) {
				var tmp = arr[n - 1];
				arr[n - 1] = arr[n - 2];
				arr[n - 2] = tmp;
			}
			return arr;
		}
		var vall = 0x76543210;
		var valh = 0xfedcba98;
		for (var i = 0; i < n - 1; i++) {
			var p = fact[n - 1 - i];
			var v = idx / p;
			idx = idx % p;
			prt ^= v;
			v <<= 2;
			if (v >= 32) {
				v = v - 32;
				arr[i] = valh >> v & 0xf;
				var m = (1 << v) - 1;
				valh = (valh & m) + ((valh >> 4) & ~m);
			} else {
				arr[i] = vall >> v & 0xf;
				var m = (1 << v) - 1;
				vall = (vall & m) + ((vall >>> 4) & ~m) + (valh << 28);
				valh = valh >> 4;
			}
		}
		if (even < 0 && (prt & 1) != 0) {
			arr[n - 1] = arr[n - 2];
			arr[n - 2] = vall & 0xf;
		} else {
			arr[n - 1] = vall & 0xf;
		}
		return arr;
	}

	function getNPerm(arr, n, even) {
		n = n || arr.length;
		var idx = 0;
		if (n >= 16) {
			for (var i = 0; i < n - 1; i++) {
				idx *= n - i;
				for (var j = i + 1; j < n; j++) {
					arr[j] < arr[i] && idx++;
				}
			}
			return even < 0 ? (idx >> 1) : idx;
		}
		var vall = 0x76543210;
		var valh = 0xfedcba98;
		for (var i = 0; i < n - 1; i++) {
			var v = arr[i] << 2;
			idx *= n - i;
			if (v >= 32) {
				idx += (valh >> (v - 32)) & 0xf;
				valh -= 0x11111110 << (v - 32);
			} else {
				idx += (vall >> v) & 0xf;
				valh -= 0x11111111;
				vall -= 0x11111110 << v;
			}
		}
		return even < 0 ? (idx >> 1) : idx;
	}

	function rn(n) {
		return ~~(Math.random() * n)
	}
	return { circle: circle, setNPerm: setNPerm, getNPerm: getNPerm, rn: rn };
})();

// ---- csTimer scramble_sq1_new.js より Square-1 ソルバ部分を抜粋 ----
var sq1 = (function(setNPerm, getNPerm, circle, rn) {

	function SqCubie() {
		this.ul = 0x011233; // 0 UB, 1 UBL, 2 UL, 3 UFL
		this.ur = 0x455677; // 4 UF, 5 UFR, 6 UR, 7 UBR
		this.dl = 0x998bba; // 9 DBR, 8 DR, b DFR, a DF
		this.dr = 0xddcffe; // d DFL, c DL, f DBL, e DB
		this.ml = 0;
	}

	var _ = SqCubie.prototype;

	_.toString = function() {
		return this.ul.toString(16).padStart(6, 0) +
			this.ur.toString(16).padStart(6, 0) +
			"|/".charAt(this.ml) +
			this.dl.toString(16).padStart(6, 0) +
			this.dr.toString(16).padStart(6, 0);
	}

	_.pieceAt = function(idx) {
		var ret;
		if (idx < 6) {
			ret = this.ul >> ((5 - idx) << 2);
		} else if (idx < 12) {
			ret = this.ur >> ((11 - idx) << 2);
		} else if (idx < 18) {
			ret = this.dl >> ((17 - idx) << 2);
		} else {
			ret = this.dr >> ((23 - idx) << 2);
		}
		return ret & 0xf;
	}

	_.setPiece = function(idx, value) {
		if (idx < 6) {
			this.ul &= ~(0xf << ((5 - idx) << 2));
			this.ul |= value << ((5 - idx) << 2);
		} else if (idx < 12) {
			this.ur &= ~(0xf << ((11 - idx) << 2));
			this.ur |= value << ((11 - idx) << 2);
		} else if (idx < 18) {
			this.dl &= ~(0xf << ((17 - idx) << 2));
			this.dl |= value << ((17 - idx) << 2);
		} else {
			this.dr &= ~(0xf << ((23 - idx) << 2));
			this.dr |= value << ((23 - idx) << 2);
		}
	}

	_.copy = function(c) {
		this.ul = c.ul;
		this.ur = c.ur;
		this.dl = c.dl;
		this.dr = c.dr;
		this.ml = c.ml;
	}

	_.doMove = function(move) {
		var temp;
		move <<= 2;
		if (move > 24) {
			move = 48 - move;
			temp = this.ul;
			this.ul = (this.ul >> move | this.ur << 24 - move) & 0xffffff;
			this.ur = (this.ur >> move | temp << 24 - move) & 0xffffff;
		} else if (move > 0) {
			temp = this.ul;
			this.ul = (this.ul << move | this.ur >> 24 - move) & 0xffffff;
			this.ur = (this.ur << move | temp >> 24 - move) & 0xffffff;
		} else if (move == 0) {
			temp = this.ur;
			this.ur = this.dl;
			this.dl = temp;
			this.ml = 1 - this.ml;
		} else if (move >= -24) {
			move = -move;
			temp = this.dl;
			this.dl = (this.dl << move | this.dr >> 24 - move) & 0xffffff;
			this.dr = (this.dr << move | temp >> 24 - move) & 0xffffff;
		} else if (move < -24) {
			move = 48 + move;
			temp = this.dl;
			this.dl = (this.dl >> move | this.dr << 24 - move) & 0xffffff;
			this.dr = (this.dr >> move | temp << 24 - move) & 0xffffff;
		}
	}

	function FullCube_getParity(obj) {
		var a, b, cnt, i, p, arr;
		cnt = 0;
		arr = [obj.pieceAt(0)];
		for (i = 1; i < 24; ++i) {
			if (obj.pieceAt(i) != arr[cnt]) {
				arr[++cnt] = obj.pieceAt(i);
			}
		}
		p = 0;
		for (a = 0; a < 16; ++a) {
			for (b = a + 1; b < 16; ++b) {
				arr[a] > arr[b] && (p ^= 1);
			}
		}
		return p;
	}

	function FullCube_getShapeIdx(obj) {
		var dlx, drx, ulx, urx;
		urx = obj.ur & 0x111111;
		urx |= urx >> 3;
		urx |= urx >> 6;
		urx = urx & 15 | urx >> 12 & 48;
		ulx = obj.ul & 0x111111;
		ulx |= ulx >> 3;
		ulx |= ulx >> 6;
		ulx = ulx & 15 | ulx >> 12 & 48;
		drx = obj.dr & 0x111111;
		drx |= drx >> 3;
		drx |= drx >> 6;
		drx = drx & 15 | drx >> 12 & 48;
		dlx = obj.dl & 0x111111;
		dlx |= dlx >> 3;
		dlx |= dlx >> 6;
		dlx = dlx & 15 | dlx >> 12 & 48;
		return Shape_getShape2Idx(FullCube_getParity(obj) << 24 | ulx << 18 | urx << 12 | dlx << 6 | drx);
	}

	function FullCube_getSquare(obj, sq) {
		var a, b;
		var prm = [];
		for (a = 0; a < 8; ++a) {
			prm[a] = obj.pieceAt(a * 3 + 1) >> 1;
		}
		sq.cornperm = getNPerm(prm, 8);
		sq.topEdgeFirst = obj.pieceAt(0) == obj.pieceAt(1);
		a = sq.topEdgeFirst ? 2 : 0;
		for (b = 0; b < 4; a += 3, ++b)
			prm[b] = obj.pieceAt(a) >> 1;
		sq.botEdgeFirst = obj.pieceAt(12) == obj.pieceAt(13);
		a = sq.botEdgeFirst ? 14 : 12;
		for (; b < 8; a += 3, ++b)
			prm[b] = obj.pieceAt(a) >> 1;
		sq.edgeperm = getNPerm(prm, 8);
		sq.ml = obj.ml;
	}

	function FullCube_randomCube(indice) {
		var f, i, shape, edge, corner, n_edge, n_corner, rnd, m;
		if (indice === undefined) {
			indice = rn(3678);
		}
		f = new SqCubie;
		shape = Shape_ShapeIdx[indice];
		corner = 0x01234567 << 1 | 0x11111111;
		edge = 0x01234567 << 1;
		n_corner = n_edge = 8;
		for (i = 0; i < 24; i++) {
			if (((shape >> i) & 1) == 0) { //edge
				rnd = rn(n_edge) << 2;
				f.setPiece(23 - i, (edge >> rnd) & 0xf);
				m = (1 << rnd) - 1;
				edge = (edge & m) + ((edge >> 4) & ~m);
				--n_edge;
			} else { //corner
				rnd = rn(n_corner) << 2;
				f.setPiece(23 - i, (corner >> rnd) & 0xf);
				f.setPiece(22 - i, (corner >> rnd) & 0xf);
				m = (1 << rnd) - 1;
				corner = (corner & m) + ((corner >> 4) & ~m);
				--n_corner;
				++i;
			}
		}
		f.ml = rn(2);
		return f;
	}

	function Search_init2(obj) {
		var corner, edge, i, j, ml, prun;
		obj.Search_d.copy(obj.Search_c);
		for (i = 0; i < obj.Search_length1; ++i) {
			obj.Search_d.doMove(obj.Search_move[i]);
		}
		FullCube_getSquare(obj.Search_d, obj.Search_sq);
		edge = obj.Search_sq.edgeperm;
		corner = obj.Search_sq.cornperm;
		ml = obj.Search_sq.ml;
		prun = Math.max(SquarePrun[obj.Search_sq.edgeperm << 1 | ml], SquarePrun[obj.Search_sq.cornperm << 1 | ml]);
		for (i = prun; i < obj.Search_maxlen2; ++i) {
			if (Search_phase2(obj, edge, corner, obj.Search_sq.topEdgeFirst, obj.Search_sq.botEdgeFirst, ml, i, obj.Search_length1, 0)) {
				for (j = 0; j < i; ++j) {
					obj.Search_d.doMove(obj.Search_move[obj.Search_length1 + j]);
				}
				obj.Search_sol_string = Search_move2string(obj, i + obj.Search_length1);
				return true;
			}
		}
		return false;
	}

	function Search_move2string(obj, len) {
		var s = "";
		var top = 0,
			bottom = 0;
		for (var i = len - 1; i >= 0; i--) {
			var val = obj.Search_move[i];
			//console.log(val);
			if (val > 0) {
				val = 12 - val;
				top = (val > 6) ? (val - 12) : val;
			} else if (val < 0) {
				val = 12 + val;
				bottom = (val > 6) ? (val - 12) : val;
			} else {
				var twst = "/";
				if (i == obj.Search_length1 - 1) {
					twst = "`/`";
				}
				if (top == 0 && bottom == 0) {
					s += twst;
				} else {
					s += " (" + top + "," + bottom + ")" + twst;
				}
				top = bottom = 0;
			}
		}
		if (top == 0 && bottom == 0) {} else {
			s += " (" + top + "," + bottom + ") ";
		}
		return s; // + " (" + len + "t)";
	}

	function Search_phase1(obj, shape, prunvalue, maxl, depth, lm) {
		var m, prunx, shapex;
		if (prunvalue == 0 && maxl < 4) {
			return maxl == 0 && Search_init2(obj);
		}
		if (lm != 0) {
			shapex = Shape_TwistMove[shape];
			prunx = ShapePrun[shapex];
			if (prunx < maxl) {
				obj.Search_move[depth] = 0;
				if (Search_phase1(obj, shapex, prunx, maxl - 1, depth + 1, 0)) {
					return true;
				}
			}
		}
		shapex = shape;
		if (lm <= 0) {
			m = 0;
			while (true) {
				m += Shape_TopMove[shapex];
				shapex = m >> 4;
				m &= 15;
				if (m >= 12) {
					break;
				}
				prunx = ShapePrun[shapex];
				if (prunx > maxl) {
					break;
				} else if (prunx < maxl) {
					obj.Search_move[depth] = m;
					if (Search_phase1(obj, shapex, prunx, maxl - 1, depth + 1, 1)) {
						return true;
					}
				}
			}
		}
		shapex = shape;
		if (lm <= 1) {
			m = 0;
			while (true) {
				m += Shape_BottomMove[shapex];
				shapex = m >> 4;
				m &= 15;
				if (m >= 6) {
					break;
				}
				prunx = ShapePrun[shapex];
				if (prunx > maxl) {
					break;
				} else if (prunx < maxl) {
					obj.Search_move[depth] = -m;
					if (Search_phase1(obj, shapex, prunx, maxl - 1, depth + 1, 2)) {
						return true;
					}
				}
			}
		}
		return false;
	}

	function Search_phase2(obj, edge, corner, topEdgeFirst, botEdgeFirst, ml, maxl, depth, lm) {
		var botEdgeFirstx, cornerx, edgex, m, prun1, prun2, topEdgeFirstx;
		if (maxl == 0 && !topEdgeFirst && botEdgeFirst) {
			return true;
		}
		if (lm != 0 && topEdgeFirst == botEdgeFirst) {
			edgex = Square_TwistMove[edge];
			cornerx = Square_TwistMove[corner];
			if (SquarePrun[edgex << 1 | 1 - ml] < maxl && SquarePrun[cornerx << 1 | 1 - ml] < maxl) {
				obj.Search_move[depth] = 0;
				if (Search_phase2(obj, edgex, cornerx, topEdgeFirst, botEdgeFirst, 1 - ml, maxl - 1, depth + 1, 0)) {
					return true;
				}
			}
		}
		if (lm <= 0) {
			topEdgeFirstx = !topEdgeFirst;
			edgex = topEdgeFirstx ? Square_TopMove[edge] : edge;
			cornerx = topEdgeFirstx ? corner : Square_TopMove[corner];
			m = topEdgeFirstx ? 1 : 2;
			prun1 = SquarePrun[edgex << 1 | ml];
			prun2 = SquarePrun[cornerx << 1 | ml];
			while (m < 12 && prun1 <= maxl && prun1 <= maxl) {
				if (prun1 < maxl && prun2 < maxl) {
					obj.Search_move[depth] = m;
					if (Search_phase2(obj, edgex, cornerx, topEdgeFirstx, botEdgeFirst, ml, maxl - 1, depth + 1, 1)) {
						return true;
					}
				}
				topEdgeFirstx = !topEdgeFirstx;
				if (topEdgeFirstx) {
					edgex = Square_TopMove[edgex];
					prun1 = SquarePrun[edgex << 1 | ml];
					m += 1;
				} else {
					cornerx = Square_TopMove[cornerx];
					prun2 = SquarePrun[cornerx << 1 | ml];
					m += 2;
				}
			}
		}
		if (lm <= 1) {
			botEdgeFirstx = !botEdgeFirst;
			edgex = botEdgeFirstx ? Square_BottomMove[edge] : edge;
			cornerx = botEdgeFirstx ? corner : Square_BottomMove[corner];
			m = botEdgeFirstx ? 1 : 2;
			prun1 = SquarePrun[edgex << 1 | ml];
			prun2 = SquarePrun[cornerx << 1 | ml];
			while (m < (maxl > 6 ? 6 : 12) && prun1 <= maxl && prun1 <= maxl) {
				if (prun1 < maxl && prun2 < maxl) {
					obj.Search_move[depth] = -m;
					if (Search_phase2(obj, edgex, cornerx, topEdgeFirst, botEdgeFirstx, ml, maxl - 1, depth + 1, 2)) {
						return true;
					}
				}
				botEdgeFirstx = !botEdgeFirstx;
				if (botEdgeFirstx) {
					edgex = Square_BottomMove[edgex];
					prun1 = SquarePrun[edgex << 1 | ml];
					m += 1;
				} else {
					cornerx = Square_BottomMove[cornerx];
					prun2 = SquarePrun[cornerx << 1 | ml];
					m += 2;
				}
			}
		}
		return false;
	}

	function Search_solution(obj, c) {
		var shape;
		obj.Search_c = c;
		shape = FullCube_getShapeIdx(c);
		//console.log(shape);
		for (obj.Search_length1 = ShapePrun[shape]; obj.Search_length1 < 100; ++obj.Search_length1) {
			//console.log(obj.Search_length1);
			obj.Search_maxlen2 = Math.min(32 - obj.Search_length1, 17);
			if (Search_phase1(obj, shape, ShapePrun[shape], obj.Search_length1, 0, -1)) {
				break;
			}
		}
		return obj.Search_sol_string;
	}

	function Search_Search() {
		this.Search_move = [];
		this.Search_d = new SqCubie;
		this.Search_sq = new Square_Square;
	}

	function Search() {}

	_ = Search_Search.prototype = Search.prototype;
	_.Search_c = null;
	_.Search_length1 = 0;
	_.Search_maxlen2 = 0;
	_.Search_sol_string = null;

	function Shape_$clinit() {
		Shape_$clinit = function() {};
		Shape_halflayer = [0, 3, 6, 12, 15, 24, 27, 30, 48, 51, 54, 60, 63];
		Shape_ShapeIdx = [];
		ShapePrun = [];
		Shape_TopMove = [];
		Shape_BottomMove = [];
		Shape_TwistMove = [];
		Shape_init();
	}

	function Shape_bottomMove(obj) {
		var move, moveParity;
		move = 0;
		moveParity = 0;
		do {
			if ((obj.bottom & 2048) == 0) {
				move += 1;
				obj.bottom = obj.bottom << 1;
			} else {
				move += 2;
				obj.bottom = obj.bottom << 2 ^ 12291;
			}
			moveParity = 1 - moveParity;
		}
		while ((bitCount(obj.bottom & 63) & 1) != 0);
		(bitCount(obj.bottom) & 2) == 0 && (obj.Shape_parity ^= moveParity);
		return move;
	}

	function Shape_getIdx(obj) {
		var ret;
		ret = binarySearch(Shape_ShapeIdx, obj.top << 12 | obj.bottom) << 1 | obj.Shape_parity;
		return ret;
	}

	function Shape_setIdx(obj, idx) {
		obj.Shape_parity = idx & 1;
		obj.top = Shape_ShapeIdx[idx >> 1];
		obj.bottom = obj.top & 4095;
		obj.top >>= 12;
	}

	function Shape_topMove(obj) {
		var move, moveParity;
		move = 0;
		moveParity = 0;
		do {
			if ((obj.top & 2048) == 0) {
				move += 1;
				obj.top = obj.top << 1;
			} else {
				move += 2;
				obj.top = obj.top << 2 ^ 12291;
			}
			moveParity = 1 - moveParity;
		}
		while ((bitCount(obj.top & 63) & 1) != 0);
		(bitCount(obj.top) & 2) == 0 && (obj.Shape_parity ^= moveParity);
		return move;
	}

	function Shape_Shape() {}

	function Shape_getShape2Idx(shp) {
		var ret;
		ret = binarySearch(Shape_ShapeIdx, shp & 0xffffff) << 1 | shp >> 24;
		return ret;
	}

	function Shape_init() {
		var count, depth, dl, done, done0, dr, i, idx, m, s, ul, ur, value, p1, p3, temp;
		count = 0;
		for (i = 0; i < 28561; ++i) {
			dr = Shape_halflayer[i % 13];
			dl = Shape_halflayer[~~(i / 13) % 13];
			ur = Shape_halflayer[~~(~~(i / 13) / 13) % 13];
			ul = Shape_halflayer[~~(~~(~~(i / 13) / 13) / 13)];
			value = ul << 18 | ur << 12 | dl << 6 | dr;
			bitCount(value) == 16 && (Shape_ShapeIdx[count++] = value);
		}
		s = new Shape_Shape;
		for (i = 0; i < 7356; ++i) {
			Shape_setIdx(s, i);
			Shape_TopMove[i] = Shape_topMove(s);
			Shape_TopMove[i] |= Shape_getIdx(s) << 4;
			Shape_setIdx(s, i);
			Shape_BottomMove[i] = Shape_bottomMove(s);
			Shape_BottomMove[i] |= Shape_getIdx(s) << 4;
			Shape_setIdx(s, i);
			temp = s.top & 63;
			p1 = bitCount(temp);
			p3 = bitCount(s.bottom & 4032);
			s.Shape_parity ^= 1 & (p1 & p3) >> 1;
			s.top = s.top & 4032 | s.bottom >> 6 & 63;
			s.bottom = s.bottom & 63 | temp << 6;
			Shape_TwistMove[i] = Shape_getIdx(s);
		}
		for (i = 0; i < 7536; ++i) {
			ShapePrun[i] = -1;
		}
		ShapePrun[Shape_getShape2Idx(14378715)] = 0;
		ShapePrun[Shape_getShape2Idx(31157686)] = 0;
		ShapePrun[Shape_getShape2Idx(23967451)] = 0;
		ShapePrun[Shape_getShape2Idx(7191990)] = 0;
		done = 4;
		done0 = 0;
		depth = -1;
		while (done != done0) {
			done0 = done;
			++depth;
			for (i = 0; i < 7536; ++i) {
				if (ShapePrun[i] == depth) {
					m = 0;
					idx = i;
					do {
						idx = Shape_TopMove[idx];
						m += idx & 15;
						idx >>= 4;
						if (ShapePrun[idx] == -1) {
							++done;
							ShapePrun[idx] = depth + 1;
						}
					}
					while (m != 12);
					m = 0;
					idx = i;
					do {
						idx = Shape_BottomMove[idx];
						m += idx & 15;
						idx >>= 4;
						if (ShapePrun[idx] == -1) {
							++done;
							ShapePrun[idx] = depth + 1;
						}
					}
					while (m != 12);
					idx = Shape_TwistMove[i];
					if (ShapePrun[idx] == -1) {
						++done;
						ShapePrun[idx] = depth + 1;
					}
				}
			}
		}
	}

	function Shape() {}

	_ = Shape_Shape.prototype = Shape.prototype;
	_.bottom = 0;
	_.Shape_parity = 0;
	_.top = 0;
	var Shape_BottomMove, Shape_ShapeIdx, ShapePrun, Shape_TopMove, Shape_TwistMove, Shape_halflayer;

	function Square_$clinit() {
		Square_$clinit = function() {};
		SquarePrun = [];
		Square_TwistMove = [];
		Square_TopMove = [];
		Square_BottomMove = [];
		Square_init();
	}

	function Square_Square() {}

	function Square_init() {
		var check, depth, done, find, i, idx, idxx, inv, m, ml, pos;
		pos = [];
		for (i = 0; i < 40320; ++i) {
			setNPerm(pos, i, 8);
			circle(pos, 2, 4)(pos, 3, 5);
			Square_TwistMove[i] = getNPerm(pos, 8);
			setNPerm(pos, i, 8);
			circle(pos, 0, 3, 2, 1);
			Square_TopMove[i] = getNPerm(pos, 8);
			setNPerm(pos, i, 8);
			circle(pos, 4, 7, 6, 5);
			Square_BottomMove[i] = getNPerm(pos, 8);
		}
		for (i = 0; i < 80640; ++i) {
			SquarePrun[i] = -1;
		}
		SquarePrun[0] = 0;
		depth = 0;
		done = 1;
		while (done < 80640) {
			//console.log(done);
			inv = depth >= 11;
			find = inv ? -1 : depth;
			check = inv ? depth : -1;
			++depth;
			OUT: for (i = 0; i < 80640; ++i) {
				if (SquarePrun[i] == find) {
					idx = i >> 1;
					ml = i & 1;
					idxx = Square_TwistMove[idx] << 1 | 1 - ml;
					if (SquarePrun[idxx] == check) {
						++done;
						SquarePrun[inv ? i : idxx] = depth;
						if (inv)
							continue OUT;
					}
					idxx = idx;
					for (m = 0; m < 4; ++m) {
						idxx = Square_TopMove[idxx];
						if (SquarePrun[idxx << 1 | ml] == check) {
							++done;
							SquarePrun[inv ? i : idxx << 1 | ml] = depth;
							if (inv)
								continue OUT;
						}
					}
					for (m = 0; m < 4; ++m) {
						idxx = Square_BottomMove[idxx];
						if (SquarePrun[idxx << 1 | ml] == check) {
							++done;
							SquarePrun[inv ? i : idxx << 1 | ml] = depth;
							if (inv)
								continue OUT;
						}
					}
				}
			}
		}
	}

	function Square() {}

	_ = Square_Square.prototype = Square.prototype;
	_.botEdgeFirst = false;
	_.cornperm = 0;
	_.edgeperm = 0;
	_.ml = 0;
	_.topEdgeFirst = false;
	var Square_BottomMove, SquarePrun, Square_TopMove, Square_TwistMove;

	function bitCount(x) {
		x -= x >> 1 & 1431655765;
		x = (x >> 2 & 858993459) + (x & 858993459);
		x = (x >> 4) + x & 252645135;
		x += x >> 8;
		x += x >> 16;
		return x & 63;
	}

	function binarySearch(sortedArray, key) {
		var high, low, mid, midVal;
		low = 0;
		high = sortedArray.length - 1;
		while (low <= high) {
			mid = low + ((high - low) >> 1);
			midVal = sortedArray[mid];
			if (midVal < key) {
				low = mid + 1;
			} else if (midVal > key) {
				high = mid - 1;
			} else {
				return mid;
			}
		}
		return -low - 1;
	}

	return {
		SqCubie: SqCubie,
		solve: function(c) {
			Shape_$clinit();
			Square_$clinit();
			return Search_solution(new Search_Search, c);
		}
	};
})(mathlib.setNPerm, mathlib.getNPerm, mathlib.circle, mathlib.rn);

<script>
"use strict";
var sq1ep = (function() {
	// 各層のEPケース（+ は自分の面側から見て時計回り）
	var CASES = ["skip", "U+", "U-", "H", "Z", "adj", "opp", "W", "O+", "O-"];
	var BASES = ["skip", "U", "H", "Z", "adj", "opp", "W", "O"];
	var N = CASES.length;

	function baseOf(c) {
		return c.replace(/[+-]$/, "");
	}

	// SqCubie の各層のエッジスロット番号は、自分の面側から見て反時計回りに増える
	// p[h] = 元スロット h のエッジが今いるスロット
	function classify(p) {
		var moved = [0, 1, 2, 3].filter(function(h) { return p[h] != h; });
		if (moved.length == 0) return "skip";
		if (moved.length == 2) return Math.abs(moved[0] - moved[1]) == 2 ? "opp" : "adj";
		if (moved.length == 3) {
			var f = [0, 1, 2, 3].filter(function(h) { return p[h] == h; })[0];
			return p[(f + 1) % 4] == (f + 2) % 4 ? "U-" : "U+";
		}
		if (p[p[0]] == 0) return p[0] == 2 ? "H" : "Z"; // 2組交換
		if (p.every(function(d, h) { return d == (h + 1) % 4; })) return "O-";
		if (p.every(function(d, h) { return d == (h + 3) % 4; })) return "O+";
		return "W";
	}

	var PERMS = {};
	CASES.forEach(function(c) { PERMS[c] = []; });
	(function permute(arr, rest) {
		if (rest.length == 0) {
			PERMS[classify(arr)].push(arr);
			return;
		}
		rest.forEach(function(x, i) {
			permute(arr.concat([x]), rest.slice(0, i).concat(rest.slice(i + 1)));
		});
	})([], [0, 1, 2, 3]);

	function rn(n) {
		return ~~(Math.random() * n);
	}

	function rndEl(arr) {
		return arr[rn(arr.length)];
	}

	// コーナー・形状・EOは揃え、各層のEPを指定ケースにし、AUF/ADFと中層をランダムにする
	function genState(topCase, botCase) {
		var cc = new sq1.SqCubie;
		var pt = rndEl(PERMS[topCase]);
		var pb = rndEl(PERMS[botCase]);
		for (var h = 0; h < 4; h++) {
			cc.setPiece(3 * pt[h], 2 * h);
			cc.setPiece(14 + 3 * pb[h], 8 + 2 * h);
		}
		var r = rn(4);
		if (r) cc.doMove(3 * r);
		r = rn(4);
		if (r) cc.doMove(-3 * r);
		cc.ml = rn(2);
		return cc;
	}

	var lastScramble = "";

	function genScramble(topCase, botCase) {
		var scr;
		for (var t = 0; t < 20; t++) {
			scr = sq1.solve(genState(topCase, botCase)).replace(/`/g, "").replace(/ +/g, " ").trim();
			if (scr != lastScramble) break;
		}
		lastScramble = scr;
		return scr;
	}

	return { CASES: CASES, BASES: BASES, N: N, baseOf: baseOf, genState: genState, genScramble: genScramble };
})();

(function() {
	if (typeof document == "undefined") return;
	var CASES = sq1ep.CASES, BASES = sq1ep.BASES, N = sq1ep.N;

	// ---- 選択状態 (sel[U層ケース * N + D層ケース]) ----
	var SEL_KEY = "sq1ep_selection";
	var sel = null;
	try {
		sel = JSON.parse(localStorage.getItem(SEL_KEY));
	} catch (e) {}
	if (!Array.isArray(sel) || sel.length != N * N) {
		sel = [];
		for (var i = 0; i < N * N; i++) sel[i] = true;
	}

	function saveSel() {
		try {
			localStorage.setItem(SEL_KEY, JSON.stringify(sel));
		} catch (e) {}
	}

	// グループ: 上下の入れ替え・+/-の違いを同一視
	function groupMembers(g1, g2) {
		var ret = [];
		for (var i = 0; i < N; i++) {
			for (var j = 0; j < N; j++) {
				var a = sq1ep.baseOf(CASES[i]), b = sq1ep.baseOf(CASES[j]);
				if (a == g1 && b == g2 || a == g2 && b == g1) ret.push(i * N + j);
			}
		}
		return ret;
	}

	var groupBoxes = [];
	var comboBoxes = [];

	function headerRow(table, corner, labels) {
		var tr = document.createElement("tr");
		[corner].concat(labels).forEach(function(s) {
			var th = document.createElement("th");
			th.textContent = s;
			tr.appendChild(th);
		});
		table.appendChild(tr);
	}

	function makeBox(td, onChange) {
		var label = document.createElement("label");
		var cb = document.createElement("input");
		cb.type = "checkbox";
		cb.addEventListener("change", onChange);
		label.appendChild(cb);
		td.appendChild(label);
		return cb;
	}

	var groupsTable = document.getElementById("groups");
	headerRow(groupsTable, "", BASES);
	BASES.forEach(function(g1, i) {
		var tr = document.createElement("tr");
		var th = document.createElement("th");
		th.textContent = g1;
		tr.appendChild(th);
		BASES.forEach(function(g2, j) {
			var td = document.createElement("td");
			if (j >= i) {
				var members = groupMembers(g1, g2);
				var cb = makeBox(td, function() {
					members.forEach(function(k) { sel[k] = cb.checked; });
					refresh();
				});
				cb.title = g1 + " × " + g2 + "（" + members.length + "通り）";
				groupBoxes.push({ cb: cb, members: members });
			}
			tr.appendChild(td);
		});
		groupsTable.appendChild(tr);
	});

	var combosTable = document.getElementById("combos");
	headerRow(combosTable, "U＼D", CASES);
	CASES.forEach(function(c1, i) {
		var tr = document.createElement("tr");
		var th = document.createElement("th");
		th.textContent = c1;
		tr.appendChild(th);
		CASES.forEach(function(c2, j) {
			var td = document.createElement("td");
			var cb = makeBox(td, function() {
				sel[i * N + j] = cb.checked;
				refresh();
			});
			cb.title = "U: " + c1 + " / D: " + c2;
			comboBoxes.push(cb);
			tr.appendChild(td);
		});
		combosTable.appendChild(tr);
	});

	function refresh() {
		groupBoxes.forEach(function(g) {
			var n = g.members.filter(function(k) { return sel[k]; }).length;
			g.cb.checked = n == g.members.length;
			g.cb.indeterminate = n > 0 && n < g.members.length;
		});
		comboBoxes.forEach(function(cb, k) { cb.checked = sel[k]; });
		document.getElementById("count").textContent =
			"選択中: " + sel.filter(function(x) { return x; }).length + " / " + N * N + " 通り";
		saveSel();
	}

	var current = null;

	function next() {
		var pool = [];
		sel.forEach(function(x, k) { if (x) pool.push(k); });
		if (pool.length == 0) {
			document.getElementById("info").textContent = "組み合わせを1つ以上選択してください";
			return;
		}
		// 選択した組み合わせからランダムに1つ選ぶ
		var k = pool[~~(Math.random() * pool.length)];
		var scrEl = document.getElementById("scramble");
		if (current) {
			document.getElementById("prev").textContent = "前 [U: " + current.top + " / D: " + current.bot + "]: " + current.scr;
		}
		document.getElementById("info").textContent = "";
		current = { top: CASES[~~(k / N)], bot: CASES[k % N] };
		current.scr = sq1ep.genScramble(current.top, current.bot);
		scrEl.textContent = current.scr;
	}

	// ---- 記録 ({t: ms, u: U層ケース, d: D層ケース}) ----
	var STORAGE_KEY = "sq1ep_times";
	var times = [];
	try {
		times = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
	} catch (e) {
		times = [];
	}
	// 旧形式（数値のみ）の記録はケース不明として読み込む
	times = times.map(function(x) { return typeof x == "number" ? { t: x, u: null, d: null } : x; });

	function saveTimes() {
		try {
			localStorage.setItem(STORAGE_KEY, JSON.stringify(times));
		} catch (e) {}
	}

	function fmt(ms) {
		if (ms == null) return "-";
		var cs = Math.floor(ms / 10);
		var s = Math.floor(cs / 100);
		var m = Math.floor(s / 60);
		var rest = (s % 60) + "." + ("0" + cs % 100).slice(-2);
		return m > 0 ? m + ":" + ("0" + rest).slice(-5) : rest;
	}

	// 直近n件の平均（最良・最悪を除く）
	function aoN(arr, n) {
		if (arr.length < n) return null;
		var a = arr.slice(-n).sort(function(x, y) { return x - y; });
		a = a.slice(1, n - 1);
		return a.reduce(function(p, c) { return p + c; }, 0) / a.length;
	}

	function meanOf(arr) {
		return arr.length ? arr.reduce(function(p, c) { return p + c; }, 0) / arr.length : null;
	}

	function bestOf(arr) {
		return arr.length ? Math.min.apply(null, arr) : null;
	}

	// ---- パターン別集計 ----
	var MODE_KEY = "sq1ep_statmode";
	var statMode = "group";
	try {
		statMode = localStorage.getItem(MODE_KEY) == "combo" ? "combo" : "group";
	} catch (e) {}

	// グループ: 上下の入れ替え・+/-の違いを同一視 / 個別: U層 / D層
	function patternKey(r) {
		if (!r.u) return null;
		if (statMode == "combo") return r.u + " / " + r.d;
		var a = sq1ep.baseOf(r.u), b = sq1ep.baseOf(r.d);
		if (BASES.indexOf(a) > BASES.indexOf(b)) {
			var tmp = a; a = b; b = tmp;
		}
		return a + " × " + b;
	}

	function renderPatterns() {
		var groups = {};
		times.forEach(function(r) {
			var key = patternKey(r);
			if (key == null) return;
			(groups[key] = groups[key] || []).push(r.t);
		});
		var rows = Object.keys(groups).map(function(key) {
			return { key: key, ts: groups[key], mean: meanOf(groups[key]) };
		});
		// 平均の遅い順（苦手なパターンが上）
		rows.sort(function(x, y) { return y.mean - x.mean; });
		var html = ["<tr><th>パターン</th><th>回数</th><th>平均</th><th>ベスト</th><th>ao5</th><th></th></tr>"];
		rows.forEach(function(row) {
			html.push("<tr><td>" + row.key + "</td><td>" + row.ts.length + "</td><td>" + fmt(row.mean) +
				"</td><td>" + fmt(bestOf(row.ts)) + "</td><td>" + fmt(aoN(row.ts, 5)) +
				"</td><td><button class=\"small\" data-key=\"" + row.key + "\">リセット</button></td></tr>");
		});
		document.getElementById("patStats").innerHTML = rows.length ? html.join("") : "";
	}

	function renderTimes() {
		var ts = times.map(function(r) { return r.t; });
		document.getElementById("stats").textContent =
			"solves: " + ts.length + "  best: " + fmt(bestOf(ts)) + "  ao5: " + fmt(aoN(ts, 5)) +
			"  ao12: " + fmt(aoN(ts, 12)) + "  mean: " + fmt(meanOf(ts));
		renderPatterns();
		var html = [];
		for (var i = times.length - 1; i >= 0; i--) {
			html.push((i + 1) + ". " + fmt(times[i].t) + (times[i].u ? "  [" + times[i].u + " / " + times[i].d + "]" : ""));
		}
		document.getElementById("times").innerHTML = html.join("<br>");
	}

	// ---- タイマー ----
	var HOLD_MS = 300;
	var timerEl = document.getElementById("timer");
	var state = "idle"; // idle / holding / ready / running / stopped
	var holdTimer = null;
	var startTime = 0;
	var rafId = null;

	function tick() {
		timerEl.textContent = fmt(performance.now() - startTime);
		rafId = requestAnimationFrame(tick);
	}

	function pressStart() {
		if (state != "idle") return;
		state = "holding";
		timerEl.className = "hold";
		holdTimer = setTimeout(function() {
			if (state == "holding") {
				state = "ready";
				timerEl.className = "ready";
				timerEl.textContent = fmt(0);
			}
		}, HOLD_MS);
	}

	function pressEnd() {
		clearTimeout(holdTimer);
		if (state == "ready") {
			state = "running";
			timerEl.className = "";
			document.body.classList.add("running");
			startTime = performance.now();
			tick();
		} else if (state == "holding") {
			state = "idle";
			timerEl.className = "";
		} else if (state == "stopped") {
			state = "idle";
		}
	}

	function stopTimer() {
		var t = performance.now() - startTime;
		cancelAnimationFrame(rafId);
		state = "stopped";
		document.body.classList.remove("running");
		timerEl.textContent = fmt(t);
		times.push({ t: Math.round(t), u: current.top, d: current.bot });
		saveTimes();
		renderTimes();
		next();
	}

	document.addEventListener("keydown", function(e) {
		if (state == "running") {
			e.preventDefault();
			stopTimer();
			return;
		}
		if (e.code == "Space") {
			e.preventDefault();
			if (!e.repeat) pressStart();
		} else if (e.code == "ArrowRight" && state == "idle") {
			next();
		}
	});
	document.addEventListener("keyup", function(e) {
		if (e.code == "Space") {
			e.preventDefault();
			pressEnd();
		} else if (state == "stopped") {
			state = "idle";
		}
	});
	timerEl.addEventListener("touchstart", function(e) {
		e.preventDefault();
		if (state == "running") {
			stopTimer();
		} else {
			pressStart();
		}
	});
	timerEl.addEventListener("touchend", function(e) {
		e.preventDefault();
		pressEnd();
	});

	document.getElementById("next").addEventListener("click", function(e) {
		next();
		e.target.blur();
	});
	document.getElementById("all").addEventListener("click", function(e) {
		for (var k = 0; k < N * N; k++) sel[k] = true;
		refresh();
		e.target.blur();
	});
	document.getElementById("clear").addEventListener("click", function(e) {
		for (var k = 0; k < N * N; k++) sel[k] = false;
		refresh();
		e.target.blur();
	});
	document.getElementById("detail").addEventListener("click", function(e) {
		var open = document.getElementById("detailWrap").classList.toggle("open");
		e.target.textContent = open ? "個別選択 ▲" : "個別選択 ▼";
		e.target.blur();
	});
	document.getElementById("dellast").addEventListener("click", function(e) {
		times.pop();
		saveTimes();
		renderTimes();
		e.target.blur();
	});
	document.getElementById("delall").addEventListener("click", function(e) {
		if (times.length && confirm("全ての記録を削除しますか？")) {
			times = [];
			saveTimes();
			renderTimes();
		}
		e.target.blur();
	});
	var modeSel = document.getElementById("statMode");
	modeSel.value = statMode;
	modeSel.addEventListener("change", function() {
		statMode = modeSel.value;
		try {
			localStorage.setItem(MODE_KEY, statMode);
		} catch (e) {}
		renderPatterns();
		modeSel.blur();
	});
	// パターンごとの記録リセット
	document.getElementById("patStats").addEventListener("click", function(e) {
		var key = e.target.getAttribute("data-key");
		if (!key) return;
		if (confirm("「" + key + "」の記録を削除しますか？")) {
			times = times.filter(function(r) { return patternKey(r) != key; });
			saveTimes();
			renderTimes();
		}
		e.target.blur();
	});
	// チェックボックス操作後にスペースでタイマーを使えるようフォーカスを外す
	document.querySelectorAll("table.cases").forEach(function(t) {
		t.addEventListener("click", function(e) {
			if (e.target.tagName == "INPUT") setTimeout(function() { e.target.blur(); }, 0);
		});
	});
	refresh();
	renderTimes();
	next();
})();
</script>
</body>
</html>
