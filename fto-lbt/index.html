<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTO LBT Trainer</title>
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --ink:#1a1d24; --muted:#6b7280; --line:#e2e5ec;
  --accent:#2b5cff; --accent-ink:#fff; --blue:#2b6cff; --red:#ff3b30; --empty:#d4d9e2;
  --chip:#eef1f6; --chip-on:#2b5cff; --chip-on-ink:#fff; --ok:#0a7d3c; --card:#fbfcfe;
  --pair:#0a7d3c; --false:#b8860b; --bot:#a03050;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --panel:#1a1e28; --ink:#e8ebf2; --muted:#9aa3b2; --line:#2b313d;
    --accent:#5b82ff; --blue:#5b8cff; --red:#ff6b62; --empty:#3a4150; --chip:#232a36;
    --chip-on:#5b82ff; --card:#161a22; --pair:#3fbf6f; --false:#e0b34a; --bot:#e07090;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#1a1e28; --ink:#e8ebf2; --muted:#9aa3b2; --line:#2b313d;
  --accent:#5b82ff; --blue:#5b8cff; --red:#ff6b62; --empty:#3a4150; --chip:#232a36;
  --chip-on:#5b82ff; --card:#161a22; --pair:#3fbf6f; --false:#e0b34a; --bot:#e07090;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.5}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.3px}
header .sub{color:var(--muted);font-size:12px}
.tabs{margin-left:auto;display:flex;gap:6px}
.tab{padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;font-size:13px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{max-width:1180px;margin:auto;padding:18px 20px 60px}
.view{display:none}.view.on{display:block}
/* selection */
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.classsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.classhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.classhead h2{font-size:15px;margin:0}
.classhead .cnt{color:var(--muted);font-size:12px}
.grp{padding:8px 14px 12px}
.grp h3{font-size:12.5px;margin:8px 0 6px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.gtag{font-size:10px;padding:1px 7px;border-radius:20px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
.chip .b{opacity:.65;font-size:10.5px}
.chip.on .b{opacity:.85}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.spacer{flex:1}
.poolinfo{font-size:12.5px;color:var(--muted)}
/* trainer */
.trainer{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media(max-width:760px){.trainer{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.stage svg{width:100%;max-width:420px;height:auto}
.badge{display:inline-block;font-size:12px;color:var(--muted);margin-bottom:6px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.side h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.ans{display:none}
.ans.on{display:block}
.ans .row{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--card)}
.ans .cn{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.ans .setup{font-size:11.5px;color:var(--muted)}
.ans .alg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;margin-top:4px;word-break:break-word}
.ans .scr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;margin-top:5px;color:var(--muted);word-break:break-word;border-top:1px dashed var(--line);padding-top:5px}
.ans .scr b{color:var(--ink);font-weight:600}
.scrbox{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-word;display:none}
.scrbox.on{display:block}
.scrbox .lab{font-family:-apple-system,sans-serif;font-size:11px;color:var(--muted);margin-bottom:3px}
.prevscr{margin-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-word;display:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.prevscr.on{display:block}
.prevscr .lab{font-family:-apple-system,sans-serif;font-size:11px;color:var(--muted);margin-right:6px}
.ans .best{outline:2px solid var(--accent);}
.hint{color:var(--muted);font-size:12px}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;text-align:center;margin-top:8px}
.timer{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:2px 0 6px;color:var(--ink)}
.timer.run{color:var(--accent)}
.sess{margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.sess b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
kbd{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}
</style>
</head>

<header>

            <span>◆ コーナー</span>

        </div>

      </div>
    </div>
  </div>
</div>

// ---- schematic render ----
const POS={TL:[-1.0,-0.7],TC:[0,-1.6],TR:[1.0,-0.7],ML:[-2.7,1.9],MR:[2.7,1.9],MB:[0,1.05],BL:[-1.45,3.75],BR:[1.45,3.75]};
const CORN={slot:[0,4.9],topL:[-3.35,-0.05],topR:[3.35,-0.05],topBack:[0,-2.55]};
function renderSVG(cfg){
  const B=new Set(cfg.blue),R=new Set(cfg.red);
  const vb="-4.7 -3.5 9.4 9.6";
  let s=`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">`;
  // faint hull connecting outer positions
  const hull=[POS.TC,POS.TR,POS.MR,POS.BR,POS.BL,POS.ML];
  s+=`<polygon points="${hull.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--line)" stroke-width="0.06"/>`;
  // positions
  for(const k in POS){
    const [x,y]=POS[k];
    const fill=B.has(k)?'var(--blue)':R.has(k)?'var(--red)':'var(--empty)';
    const dash=(k==='MB')?' stroke-dasharray="0.18 0.14"':'';
    s+=`<circle cx="${x}" cy="${y}" r="0.62" fill="${fill}" stroke="var(--ink)" stroke-width="0.05" opacity="0.95"${dash}/>`;
    s+=`<text x="${x}" y="${y+0.17}" font-size="0.42" text-anchor="middle" fill="${(B.has(k)||R.has(k))?'#fff':'var(--muted)'}" font-family="monospace">${k}</text>`;
  }
  // corner marker
  const [cx,cy]=CORN[cfg.corner[0]];
  const col=cfg.corner[1]; // G / W / A / A2
  s+=`<g transform="translate(${cx} ${cy}) rotate(45)">`;
  s+=`<rect x="-0.62" y="-0.62" width="1.24" height="1.24" rx="0.12" fill="var(--ink)" />`;
  // two facelet chips (blue+red) to signal corner colors; blue-left for G/A
  const blueLeft=(col==='G'||col==='A');
  const left=blueLeft?'var(--blue)':'var(--red)', right=blueLeft?'var(--red)':'var(--blue)';
  s+=`<rect x="-0.55" y="-0.15" width="0.5" height="0.5" fill="${left}"/>`;
  s+=`<rect x="0.05" y="-0.15" width="0.5" height="0.5" fill="${right}"/>`;
  s+=`</g>`;
  s+=`<text x="${cx}" y="${cy+1.02}" font-size="0.4" text-anchor="middle" fill="var(--muted)">◆${cfg.corner[0]}·${col}</text>`;
  s+=`</svg>`;
  return s;
}

let variantsOn=true; try{const v=localStorage.getItem('fto_lbt_variants'); if(v==='0')variantsOn=false;}catch(e){}
function pickVariant(cfg){
  if(variantsOn && cfg.variants && cfg.variants.length) return cfg.variants[Math.floor(Math.random()*cfg.variants.length)];
  return {corner:cfg.corner,blue:cfg.blue,red:cfg.red,scr:cfg.scr,elig:cfg.elig};
}
function buildPool(){
  pool=DATA.configs.filter(c=>c.elig.some(e=>sel.has(e.case)));
  caseMap={};
  pool.forEach(c=>c.elig.forEach(e=>{ if(sel.has(e.case)){ (caseMap[e.case]=caseMap[e.case]||[]).push(c); } }));
  presentCases=Object.keys(caseMap);
}
function pickCfg(){
  if(mode==='pattern'&&presentCases.length){
    const cs=presentCases[Math.floor(Math.random()*presentCases.length)];
    const arr=caseMap[cs];
    return arr[Math.floor(Math.random()*arr.length)];
  }
  return pool[Math.floor(Math.random()*pool.length)];
}
function renderStage(){
  if(!pool.length){document.getElementById('svgbox').innerHTML='<p class="hint">プールが空です。ケースを選択してください。</p>';document.getElementById('stagebadge').textContent='—';cur=null;return;}
  cur=pickCfg(); curVar=pickVariant(cur); seen++;
  document.getElementById('svgbox').innerHTML=renderSVG(curVar);
  document.getElementById('stagebadge').textContent=CLSLABEL[cur.cls]+' — '+GRPNUM[cur.grp]+' '+cur.grpname;
  curScr=curVar.scr||null;

}

  if(v.elig.length>1){const h=document.createElement('div');h.className='hint';h.textContent='※同グループの複数手順が該当（どれでも可）。枠付きが最短。';a.appendChild(h);}
}
function setPrev(scr){const pb=document.getElementById('prevbox');if(scr){document.getElementById('prevtext').textContent=scr;pb.classList.add('on');}else pb.classList.remove('on');}
function fmt(ms){return (ms/1000).toFixed(2);}
function updateStats(){
  const n=times.length; if(!n){document.getElementById('sess').innerHTML='';return;}
  const last=times[n-1], best=Math.min(...times);
  const mean=times.reduce((a,b)=>a+b,0)/n;
  let ao5='—'; if(n>=5){const l5=times.slice(-5).slice().sort((a,b)=>a-b).slice(1,4); ao5=fmt(l5.reduce((a,b)=>a+b,0)/3);}
  document.getElementById('sess').innerHTML=`計測 <b>${n}</b>　直前 <b>${fmt(last)}</b>　最速 <b>${fmt(best)}</b>　平均 <b>${fmt(mean)}</b>　ao5 <b>${ao5}</b>`;
}
function tick(){ if(!running)return; document.getElementById('timer').textContent=fmt(performance.now()-startT); raf=requestAnimationFrame(tick); }
function startTimer(){ if(!cur)return; hideAnswer(); running=true; startT=performance.now(); const t=document.getElementById('timer'); t.classList.add('run'); t.textContent='0.00'; tick(); }
function stopTimer(){
  running=false; cancelAnimationFrame(raf);
  const t=performance.now()-startT; document.getElementById('timer').textContent=fmt(t); document.getElementById('timer').classList.remove('run');
  times.push(t); updateStats();
  const pscr=curScr; // scramble just solved
  showAnswer(curVar);   // reveal answer of the just-solved case
  renderStage();     // advance to next config/scramble (answer stays showing previous)
  setPrev(pscr);     // keep the previous scramble visible for checking
}
document.getElementById('start').onclick=()=>{
  if(!poolSize()){alert('ケースを1つ以上選択してください。');return;}
  buildPool(); switchTab('run'); seen=0; times=[]; updateStats(); running=false;
  document.getElementById('timer').textContent='0.00'; hideAnswer(); renderStage(); setPrev(null);
};
document.getElementById('next').onclick=()=>{ if(running)return; const pscr=curScr; hideAnswer(); document.getElementById('timer').textContent='0.00'; renderStage(); setPrev(pscr); };
document.getElementById('reveal').onclick=()=>{ if(!running) showAnswer(curVar); };
document.getElementById('scrtoggle').onchange=e=>{ document.getElementById('scrbox').classList.toggle('on', e.target.checked && !!cur); };
(function(){const ms=document.getElementById('mode'); ms.value=mode; ms.onchange=e=>{ mode=e.target.value; try{localStorage.setItem('fto_lbt_mode',mode);}catch(_){}}; })();
(function(){const vt=document.getElementById('vartoggle'); vt.checked=variantsOn; vt.onchange=e=>{ variantsOn=e.target.checked; try{localStorage.setItem('fto_lbt_variants',variantsOn?'1':'0');}catch(_){}}; })();
document.addEventListener('keydown',e=>{
  if(!document.getElementById('view-run').classList.contains('on'))return;
  if(e.code==='Space'){ e.preventDefault(); if(running) stopTimer(); else startTimer(); }
  else if(e.key==='n'||e.key==='N'){ if(!running){ const pscr=curScr; hideAnswer(); document.getElementById('timer').textContent='0.00'; renderStage(); setPrev(pscr); } }
});
// tabs
function switchTab(t){
  document.getElementById('view-sel').classList.toggle('on',t==='sel');
  document.getElementById('view-run').classList.toggle('on',t==='run');
  document.getElementById('tab-sel').classList.toggle('on',t==='sel');
  document.getElementById('tab-run').classList.toggle('on',t==='run');
  if(t==='run'&&!cur){buildPool();renderStage();}
}
document.getElementById('tab-sel').onclick=()=>switchTab('sel');
document.getElementById('tab-run').onclick=()=>{ if(!poolSize()){alert('先にケースを選択してください。');return;} if(!pool.length)buildPool(); switchTab('run'); };
// theme toggle
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement; const cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme', cur==='dark'?'light':'dark');
};
// init
buildSel();
// restore previous selection from localStorage, else default to pair/keyhole
(function(){
  let restored=false;
  try{
    const saved=JSON.parse(localStorage.getItem('fto_lbt_sel'));
    if(Array.isArray(saved)&&saved.length){ saved.forEach(c=>{ if(bucket[c]!==undefined) sel.add(+c); }); restored=sel.size>0; }
  }catch(e){}
  if(restored) refresh();
  else document.getElementById('pairsonly').click();
})();
</script>
